# ──────────────────────────────────────────────
# Zoom-Out — Development Infrastructure
# ──────────────────────────────────────────────
# Usage: docker compose -f infra/docker-compose.yml --env-file .env up -d

services:
  # ──── PostgreSQL ────
  postgres:
    image: postgres:17-alpine
    container_name: zoomout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──── Redis (required by LiveKit) ────
  redis:
    image: redis:7-alpine
    container_name: zoomout-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ──── LiveKit SFU ────
  livekit:
    image: livekit/livekit-server:latest
    container_name: zoomout-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"   # LiveKit (HTTP / WebSocket)
      - "7881:7881"   # TURN over TCP
      - "7882:7882"   # TURN over TLS (if configured)
      - "50000-50060:50000-50060/udp"  # ICE/UDP media
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # ──── Caddy Reverse Proxy (HTTPS local dev) ────
  caddy:
    image: caddy:2-alpine
    container_name: zoomout-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (Let's Encrypt challenge & redirect)
      - "443:443"    # Web app + API (HTTPS)
      - "7443:7443"  # LiveKit WSS (señalización)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit

  # ──── LiveKit Egress (Recording) ────
  livekit-egress:
    image: livekit/egress:latest
    container_name: zoomout-egress
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - livekit
      - minio
      - redis


  # ──── MinIO (S3-compatible Object Storage) ────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: zoomout-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──── MinIO Init (create buckets) ────
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: zoomout-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_AUDIENCIAS: ${MINIO_BUCKET_AUDIENCIAS:-audiencias}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

  # ──── Faster-Whisper (AI Transcription) ────
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: zoomout-whisper
    restart: unless-stopped
    ports:
      - "9090:8000"
    volumes:
      - whisper_models:/root/.cache/huggingface
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER__DEVICE: cpu

  # ──── Ollama (Nano LLM Autoalojado) ────
  ollama:
    image: ollama/ollama:latest
    container_name: zoomout-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 1

  # ──── Ollama Init (Pull Model) ────
  ollama-init:
    image: curlimages/curl:latest
    container_name: zoomout-ollama-init
    depends_on:
      - ollama
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando que Ollama esté listo...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Descargando modelo ${OLLAMA_MODEL:-gemma3:4b}...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\":\"${OLLAMA_MODEL:-gemma3:4b}\"}' | tail -n 1;
      echo '✅ Modelo descargado y listo';
      "

volumes:
  pg_data:
  minio_data:
  whisper_models:
  ollama_models:
  caddy_data:
  caddy_config:
